name: Apply prepared MVP payload (one-time)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap-mvp.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply project files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil
          with ZipFile('MVP-Payload.zip') as archive:
              archive.extractall('_payload')
          source = Path('_payload')
          for item in source.rglob('*'):
              if item.is_file():
                  destination = Path('.') / item.relative_to(source)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(item, destination)
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run engine tests
        run: npm test -- --reporter=dot
      - name: Type-check and build
        run: npm run build
      - name: Commit playable MVP to main and remove bootstrap payload
        run: |
          rm -rf MVP-Payload.zip _payload .github/workflows/bootstrap-mvp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deliver playable offline career MVP'
          git push origin HEAD:main
